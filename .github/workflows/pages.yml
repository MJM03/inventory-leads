name: Deploy Inventory Leads to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate lead batch JavaScript
        run: node --check leads-batch-v150.js
      - name: Validate final lead count
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const ctx={window:{},console,document:{readyState:'complete',write(){}}};
          vm.createContext(ctx);
          for(const f of ['leads.js','leads-reset-v42.js','leads-strict-v41.js','leads-batch-v126.js','leads-batch-v126b.js','leads-logistics-v130.js','leads-batch-v150.js']){
            vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
            console.log(f, Array.isArray(ctx.window.INVENTORY_LEADS)?ctx.window.INVENTORY_LEADS.length:'no leads');
          }
          console.log('batch',ctx.window.AGP_LEAD_BATCH_150);
          if(!ctx.window.AGP_LEAD_BATCH_150 || ctx.window.AGP_LEAD_BATCH_150.added!==150) process.exit(2);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
