<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotización AGP</title><script src="brand-logo.js?v=30"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>:root{--navy:#0D1B2A;--blue:#153A5C;--orange:#FF8A00;--slate:#64748B}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#16202b;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{max-width:900px;margin:28px auto;padding:0 18px}.tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#fff;color:var(--navy)}.btn.primary{background:var(--navy);color:#fff}.pdfStatus{font-size:11px;color:var(--slate);margin-right:auto;align-self:center}.doc{background:#fff;border-radius:22px;overflow:hidden}.topline{height:8px;background:linear-gradient(90deg,var(--navy),var(--blue) 72%,var(--orange) 72%)}.header{display:flex;justify-content:space-between;align-items:center;padding:24px 34px;border-bottom:1px solid #e9edf0}.logo{width:310px;max-width:52%;height:auto}.quoteMeta{text-align:right}.quoteMeta b{display:block;font-size:21px;color:var(--navy)}.quoteMeta span{display:block;color:var(--slate);font-size:12px;margin-top:5px}.content{padding:26px 34px}.client{display:flex;justify-content:space-between;padding:19px;background:#fafbfc;border-radius:16px}.client h1{margin:5px 0;color:var(--navy)}.price{text-align:right}.price strong{display:block;font-size:36px;color:var(--orange)}.section{margin-top:21px}.section h2{font-size:13px;color:var(--navy)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{padding:12px;background:#f6f8fa;border-radius:12px}.footer{padding:18px 34px;background:var(--navy);color:white}.accent{color:var(--orange)}</style></head><body><div class="wrap"><div class="tools"><span id="pdfStatus" class="pdfStatus">PDF A4 limpio · logo AGP</span><button class="btn" onclick="window.close()">Cerrar</button><button id="downloadBtn" class="btn primary" onclick="downloadPDF()">Descargar PDF</button></div><article class="doc"><div class="topline"></div><header class="header"><img id="brandLogo" class="logo" alt="AGP"><div class="quoteMeta"><b>Cotización de inventario</b><span id="date"></span><span>AGP Control Integral</span></div></header><main class="content"><section class="client"><div><small>PROPUESTA PARA</small><h1 id="company">Cliente</h1><span id="clientMeta"></span></div><div class="price"><small>INVERSIÓN PROPUESTA</small><strong id="price">S/ 0</strong><span id="range"></span></div></section><section class="section"><h2>ALCANCE ESTIMADO</h2><div class="grid" id="details"></div></section><section class="section"><h2>SERVICIO INCLUIDO</h2><ul id="scope"></ul></section></main><footer class="footer"><b>AGP · Análisis · Gestión · Precisión</b> · Cada activo cuenta. Cada decisión importa.</footer></article></div><script>const d=JSON.parse(localStorage.getItem('agpPrintableQuote')||'{}');if(window.AGP_LOGO)document.getElementById('brandLogo').src=window.AGP_LOGO;date.textContent='Emitida: '+(d.createdAt||new Date().toLocaleDateString('es-PE'));company.textContent=d.company||'Cliente';clientMeta.textContent=[d.sector,d.district,d.whatsapp].filter(Boolean).join(' · ');price.textContent=d.price||'S/ 0';range.textContent=d.range||'';const rows=[['Tipo de negocio',d.type],['Volumen',d.volume],['Equipo',`${d.people||'-'} personas · ${d.hours||'-'} h estimadas`],['Condición',d.order],['Movilidad / gastos',`S/ ${d.travel||0}`],['Margen',`${d.margin||0}%`]];details.innerHTML=rows.map(([k,v])=>`<div class=item><b>${k}</b><br>${v||'-'}</div>`).join('');let items=['Conteo físico y consolidación del inventario','Entrega de reporte final del servicio'];if(d.diff)items.push('Revisión de diferencias de stock');if(d.serial)items.push('Control de IMEI, series o lotes');scope.innerHTML=items.map(x=>`<li>${x}</li>`).join('');function safeName(v){return(v||'Cliente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').slice(0,60)}function hex(c){return c.match(/\w\w/g).map(x=>parseInt(x,16))}function fill(pdf,c){pdf.setFillColor(...hex(c))}function text(pdf,t,x,y,s=10,st='normal',c='#16202b',o={}){pdf.setFont('helvetica',st);pdf.setFontSize(s);pdf.setTextColor(...hex(c));pdf.text(String(t||''),x,y,o)}function drawLogo(pdf,x,y){const navy='#0D1B2A',blue='#153A5C',orange='#FF8A00';fill(pdf,navy);pdf.lines([[13,7],[-8,4],[-13,-7],[8,-4]],x,y,[1,1],'F',true);fill(pdf,orange);pdf.lines([[8,4],[7,4],[-10,5],[-6,-4]],x+13,y+7,[1,1],'F',true);fill(pdf,navy);pdf.lines([[0,0],[12,7],[0,15],[-12,-7]],x,y+8,[1,1],'F',true);fill(pdf,blue);pdf.lines([[0,0],[14,-7],[0,15],[-14,7]],x+13,y+15,[1,1],'F',true);fill(pdf,'#FFFFFF');pdf.lines([[0,0],[7,-3.5],[0,6],[-7,3.5]],x+17,y+17,[1,1],'F',true);fill(pdf,orange);for(let i=0;i<4;i++)pdf.rect(x+18+i*1.8,y+23-i*.8,1,6+i*.8,'F');text(pdf,'AGP',x+32,y+18,21,'bold',navy);text(pdf,'ANÁLISIS · GESTIÓN · PRECISIÓN',x+32,y+24,5.7,'bold',navy);text(pdf,'Cada activo cuenta. Cada decisión importa.',x+32,y+29,5.4,'normal','#64748B')}async function downloadPDF(){const btn=document.getElementById('downloadBtn'),status=document.getElementById('pdfStatus');btn.disabled=true;try{const{jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'}),navy='#0D1B2A',orange='#FF8A00',slate='#64748B';fill(pdf,navy);pdf.rect(0,0,162,5,'F');fill(pdf,orange);pdf.rect(162,0,48,5,'F');drawLogo(pdf,14,12);text(pdf,'COTIZACIÓN DE INVENTARIO',196,18,13,'bold',navy,{align:'right'});text(pdf,'AGP Control Integral',196,24,8,'normal',slate,{align:'right'});text(pdf,'Emitida: '+(d.createdAt||new Date().toLocaleDateString('es-PE')),196,29,8,'normal',slate,{align:'right'});pdf.setDrawColor(228,232,236);pdf.line(14,44,196,44);fill(pdf,'#FAFBFC');pdf.roundedRect(14,51,182,38,5,5,'F');text(pdf,'PROPUESTA PARA',21,60,7,'bold',slate);text(pdf,d.company||'Cliente',21,70,19,'bold',navy);text(pdf,[d.sector,d.district,d.whatsapp].filter(Boolean).join(' · '),21,78,8,'normal',slate);text(pdf,'INVERSIÓN PROPUESTA',188,60,7,'bold',slate,{align:'right'});text(pdf,d.price||'S/ 0',188,74,23,'bold',orange,{align:'right'});text(pdf,d.range||'',188,81,8,'normal',slate,{align:'right'});text(pdf,'ALCANCE ESTIMADO',14,101,10,'bold',navy);const rr=[['Tipo de negocio',d.type||'-'],['Volumen',d.volume||'-'],['Equipo',`${d.people||'-'} personas · ${d.hours||'-'} h`],['Condición',d.order||'-'],['Movilidad',`S/ ${d.travel||0}`],['Margen',`${d.margin||0}%`]];rr.forEach((r,i)=>{let x=i%2?106:14,y=106+Math.floor(i/2)*20;fill(pdf,'#F4F6F8');pdf.roundedRect(x,y,90,16,3,3,'F');text(pdf,r[0],x+4,y+6,7,'bold',navy);text(pdf,r[1],x+4,y+12,7.5,'normal','#42515F')});let y=173;text(pdf,'SERVICIO INCLUIDO',14,y,10,'bold',navy);y+=9;items.forEach(s=>{fill(pdf,orange);pdf.circle(17,y-1,1,'F');text(pdf,s,21,y,8.3,'normal','#42515F');y+=8});y+=5;text(pdf,'CONDICIONES COMERCIALES',14,y,10,'bold',navy);y+=8;const terms=[['Validez','7 días calendario desde la emisión.'],['Programación','Sujeta a fecha y horario confirmados.'],['Pago','A coordinar antes del servicio.']];terms.forEach((t,i)=>{let x=14+i*61;pdf.setDrawColor(228,232,236);pdf.roundedRect(x,y,57,25,3,3,'S');text(pdf,t[0],x+4,y+7,7.5,'bold',navy);text(pdf,pdf.splitTextToSize(t[1],49),x+4,y+13,7,'normal',slate)});y+=32;fill(pdf,'#FFF8EF');pdf.roundedRect(14,y,182,24,3,3,'F');text(pdf,'IMPORTANTE',20,y+7,7.5,'bold','#8A5200');text(pdf,pdf.splitTextToSize('El precio corresponde al alcance estimado. Cambios materiales en SKU, horas, áreas o complejidad pueden requerir ajustar la propuesta antes del servicio.',166),20,y+13,7.3,'normal','#5B4B35');fill(pdf,navy);pdf.rect(0,278,210,19,'F');text(pdf,'AGP · Análisis · Gestión · Precisión',14,286,8,'bold','#FFFFFF');text(pdf,'Cada activo cuenta. Cada decisión importa.',14,292,7,'normal','#D7DEE5');text(pdf,'INVENTARIOS CONFIABLES',196,286,8,'bold',orange,{align:'right'});pdf.save(`Cotizacion_AGP_${safeName(d.company)}.pdf`);status.textContent='PDF generado con logo AGP';}catch(e){console.error(e);status.textContent='Error al generar PDF';}finally{btn.disabled=false}}</script></body></html>
