<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Inventory Leads · WhatsApp</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,-apple-system,sans-serif}.w{max-width:1300px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.sub{color:#91a9c1;margin:5px 0 16px}.navs{display:flex;gap:8px;flex-wrap:wrap}.b{border:1px solid #2a4968;background:#17304d;color:#fff;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:12px;cursor:pointer}.green{background:#176b49;border-color:#24815c}.blue{background:#315a9b}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:16px 0}.stat{background:#0e1d30;border:1px solid #243b56;border-radius:14px;padding:13px}.stat span{font-size:11px;color:#91a9c1;text-transform:uppercase}.stat b{font-size:24px;display:block;margin-top:4px}.tools{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-bottom:14px}.ctl{padding:10px 11px;border-radius:10px;border:1px solid #243b56;background:#0b192a;color:#fff;width:100%}.notice{background:rgba(40,209,124,.07);border:1px solid rgba(40,209,124,.25);border-radius:12px;padding:11px 13px;color:#cceedd;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:14px}.c{background:#0e1d30;border:1px solid #243b56;border-radius:16px;padding:14px;position:relative}.head{display:flex;justify-content:space-between;gap:10px}.name{font-weight:850;font-size:17px}.meta{font-size:12px;color:#91a9c1;margin-top:3px}.score{font-weight:900;color:#62e6a5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.chip{font-size:11px;border:1px solid #294765;background:#142b46;padding:5px 8px;border-radius:999px}.hot{border-color:#2f855c;color:#bff0d5}.msg{font-size:12.5px;line-height:1.45;background:#0b192a;border-radius:10px;padding:10px;margin-top:9px;color:#d8e6f4}.contact{color:#91a9c1;font-size:12px;display:grid;gap:4px;margin-top:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.small{font-size:11px;color:#91a9c1}.empty{grid-column:1/-1;padding:40px;text-align:center;color:#91a9c1;border:1px dashed #243b56;border-radius:14px}dialog{width:min(720px,calc(100% - 24px));background:#0b192a;color:#fff;border:1px solid #243b56;border-radius:16px;padding:0}dialog::backdrop{background:#02070dcc}.modal{padding:18px}.close{float:right;background:#17304d;color:#fff;border:0;border-radius:8px;padding:7px 9px}.stages{display:flex;gap:6px;flex-wrap:wrap}.stage{border:1px solid #294765;background:#11243a;color:#fff;padding:7px 8px;border-radius:8px;font-size:11px}.stage.on{background:#315a9b}.row{border-top:1px solid #243b56;margin-top:13px;padding-top:13px}.row h3{font-size:11px;color:#91a9c1;text-transform:uppercase}.textarea{width:100%;min-height:120px;background:#081523;color:#fff;border:1px solid #243b56;border-radius:10px;padding:10px;resize:vertical}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.grid{grid-template-columns:1fr}}@media(max-width:560px){.w{padding:14px}.tools{grid-template-columns:1fr}.tools input{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><div class="top"><div><h1>💬 Inventory Leads · WhatsApp</h1><div class="sub">Prospección comercial por WhatsApp para servicios de inventario.</div></div><div class="navs"><a class="b" href="index.html">CRM</a><a class="b" href="map.html">Mapa</a></div></div><div class="notice"><b>Modo WhatsApp:</b> prioriza negocios con WhatsApp público y buen encaje para un equipo pequeño. Envía mensajes personalizados, evita envíos masivos y usa seguimiento moderado.</div><section id="stats" class="stats"></section><section class="tools"><input id="q" class="ctl" placeholder="Buscar empresa, rubro, distrito"><select id="waFilter" class="ctl"><option value="all">Todos</option><option value="yes">✅ Con WhatsApp</option><option value="no">🟡 Sin WhatsApp</option></select><select id="outFilter" class="ctl"><option value="all">Todos los estados</option><option>Sin contactar</option><option>Mensaje enviado</option><option>Respondió</option><option>Interesado</option><option>Seguimiento</option><option>No interesado</option></select><select id="sector" class="ctl"><option value="all">Todos los rubros</option></select><select id="sort" class="ctl"><option value="wa">Prioridad WhatsApp</option><option value="close">Accesibilidad</option><option value="score">Necesidad</option><option value="name">Nombre</option></select></section><section id="grid" class="grid"></section></main><dialog id="detail"><div class="modal" id="modal"></div></dialog><script>const $=s=>document.querySelector(s),outStages=['Sin contactar','Mensaje enviado','Respondió','Interesado','Seguimiento','No interesado'];const savedOut=JSON.parse(localStorage.getItem('inventoryLeadOutreach')||'{}');const savedMsg=JSON.parse(localStorage.getItem('inventoryLeadMessages')||'{}');const digits=v=>(v||'').replace(/\D/g,'');function waNum(v){let x=digits(v);if(!x)return'';if(x.startsWith('51')&&x.length>=11)return x;if(x.length===9)return'51'+x;return''}function msgFor(l){if(savedMsg[l.id])return savedMsg[l.id];const rubro=l.sector?.toLowerCase()||'';let foco='tienda o almacén';if(rubro.includes('ferreter'))foco='ferretería o almacén';else if(rubro.includes('tecnolog'))foco='tienda o almacén de tecnología';else if(rubro.includes('repuesto'))foco='almacén de repuestos';else if(rubro.includes('libr'))foco='librería o almacén';return `Hola, buen día. Somos un pequeño equipo que realiza inventarios físicos para negocios en Lima y Callao. Vi que manejan mercadería en su ${foco} y quería consultar si actualmente realizan sus inventarios internamente o si alguna vez evalúan apoyo externo. Podemos trabajar conteos puntuales, conciliación de diferencias y entregar un reporte ordenado. Si les interesa, puedo enviarles una propuesta breve sin compromiso.`}function waScore(l){let s=Math.round((l.closeScore||0)*.45+(l.score||0)*.35);if(waNum(l.whatsapp))s+=20;else if(waNum(l.phone))s+=5;if(l.status==='Por contactar')s+=3;return Math.min(100,s)}async function boot(){const txt=await fetch('index.html').then(r=>r.text()),m=txt.match(/const leads=(\[.*?\]);\s*const \$/s);if(!m){grid.innerHTML='<div class=empty>No se pudo leer la base.</div>';return}const leads=JSON.parse(m[1]);leads.forEach(l=>{l.outreach=savedOut[l.id]||'Sin contactar';l.waScore=waScore(l)});[...new Set(leads.map(x=>x.sector))].sort().forEach(s=>sector.insertAdjacentHTML('beforeend',`<option>${s}</option>`));function drawStats(){const has=leads.filter(l=>waNum(l.whatsapp)).length,sent=leads.filter(l=>l.outreach==='Mensaje enviado').length,replied=leads.filter(l=>['Respondió','Interesado'].includes(l.outreach)).length,hot=leads.filter(l=>waNum(l.whatsapp)&&l.waScore>=85).length;stats.innerHTML=`<div class=stat><span>Prospectos</span><b>${leads.length}</b></div><div class=stat><span>Con WhatsApp</span><b>${has}</b></div><div class=stat><span>Prioridad alta</span><b>${hot}</b></div><div class=stat><span>Mensajes enviados</span><b>${sent}</b></div><div class=stat><span>Respondieron</span><b>${replied}</b></div>`}function draw(){const qq=q.value.toLowerCase(),wf=waFilter.value,of=outFilter.value,sec=sector.value,so=sort.value;let a=leads.filter(l=>{const hay=[l.company,l.sector,l.location,l.phone,l.whatsapp,l.email].join(' ').toLowerCase();const has=!!waNum(l.whatsapp);return hay.includes(qq)&&(wf==='all'||(wf==='yes'&&has)||(wf==='no'&&!has))&&(of==='all'||l.outreach===of)&&(sec==='all'||l.sector===sec)});a.sort((a,b)=>so==='name'?a.company.localeCompare(b.company):so==='score'?b.score-a.score:so==='close'?b.closeScore-a.closeScore:b.waScore-a.waScore);grid.innerHTML=a.length?a.map(l=>{const wn=waNum(l.whatsapp),msg=msgFor(l);return `<article class=c><div class=head><div><div class=name>${l.company}</div><div class=meta>${l.sector} · ${l.location}</div></div><div class=score>${l.waScore}/100</div></div><div class=chips><span class="chip ${wn?'hot':''}">${wn?'✅ WhatsApp listo':'🟡 Sin WhatsApp válido'}</span><span class=chip>${l.outreach}</span></div><div class=msg>${msg}</div><div class=contact>${l.whatsapp?`<div>💬 ${l.whatsapp}</div>`:''}${l.phone?`<div>📞 ${l.phone}</div>`:''}${l.email?`<div>✉️ ${l.email}</div>`:''}</div><div class=actions><button class="b blue" onclick="openLead('${l.id}')">Gestionar</button>${wn?`<a class="b green" target=_blank onclick="markSent('${l.id}')" href="https://wa.me/${wn}?text=${encodeURIComponent(msg)}">Abrir WhatsApp</a>`:''}</div></article>`}).join(''):'<div class=empty>No hay prospectos con esos filtros.</div>'}window.markSent=id=>{const l=leads.find(x=>x.id===id);if(l&&l.outreach==='Sin contactar'){l.outreach='Mensaje enviado';savedOut[id]=l.outreach;localStorage.setItem('inventoryLeadOutreach',JSON.stringify(savedOut));drawStats();setTimeout(draw,300)}};window.openLead=id=>{const l=leads.find(x=>x.id===id),msg=msgFor(l);modal.innerHTML=`<button class=close onclick="detail.close()">Cerrar</button><h2>${l.company}</h2><div class=meta>${l.sector} · ${l.location}</div><div class=row><h3>Prioridad WhatsApp</h3><b>${l.waScore}/100</b><p class=small>Necesidad ${l.score}/100 · Accesibilidad ${l.closeScore}/100</p></div><div class=row><h3>Estado comercial</h3><div class=stages>${outStages.map(s=>`<button class="stage ${s===l.outreach?'on':''}" onclick="setOut('${l.id}','${s}')">${s}</button>`).join('')}</div></div><div class=row><h3>Mensaje sugerido</h3><textarea id=msgBox class=textarea>${msg}</textarea><div class=actions><button class=b onclick="saveMsg('${l.id}')">Guardar mensaje</button><button class=b onclick="resetMsg('${l.id}')">Restaurar sugerido</button>${waNum(l.whatsapp)?`<a class="b green" target=_blank onclick="markSent('${l.id}')" href="https://wa.me/${waNum(l.whatsapp)}?text=${encodeURIComponent(msg)}">Enviar por WhatsApp</a>`:''}</div></div><div class=row><h3>Contacto</h3><p>💬 ${l.whatsapp||'Pendiente'}<br>📞 ${l.phone||'Pendiente'}<br>✉️ ${l.email||'Pendiente'}</p></div>`;detail.showModal()};window.setOut=(id,s)=>{const l=leads.find(x=>x.id===id);l.outreach=s;savedOut[id]=s;localStorage.setItem('inventoryLeadOutreach',JSON.stringify(savedOut));drawStats();draw();openLead(id)};window.saveMsg=id=>{savedMsg[id]=msgBox.value.trim();localStorage.setItem('inventoryLeadMessages',JSON.stringify(savedMsg));draw();alert('Mensaje guardado para este prospecto.')};window.resetMsg=id=>{delete savedMsg[id];localStorage.setItem('inventoryLeadMessages',JSON.stringify(savedMsg));draw();openLead(id)};[q,waFilter,outFilter,sector,sort].forEach(x=>x.oninput=draw);drawStats();draw()}boot();</script></body></html>
