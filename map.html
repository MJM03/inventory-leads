<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Leads · Mapa</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,-apple-system,sans-serif}.w{max-width:1200px;margin:auto;padding:18px}h1{margin:0}.sub{color:#91a9c1;margin:5px 0 18px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:14px}input,select{padding:11px;border-radius:10px;border:1px solid #243b56;background:#0b192a;color:#fff}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{padding:8px 11px;border:1px solid #243b56;border-radius:999px;color:#bcd0e3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.c{background:#0e1d30;border:1px solid #243b56;border-radius:15px;padding:14px}.name{font-weight:800}.meta,.addr{color:#91a9c1;font-size:13px;margin-top:5px}.addr{color:#d7e7f5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.b{display:inline-block;text-decoration:none;color:#fff;background:#17304d;border:1px solid #2a4968;border-radius:8px;padding:8px 10px;font-size:12px}.map{background:#176b49}.warn{color:#ffc14d;font-size:12px;margin-top:7px}.ok{color:#62e6a5;font-size:12px;margin-top:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>📍 Inventory Leads · Mapeo</h1><div class="sub">Ubicación comercial de los prospectos. Abre cada negocio directamente en Google Maps para validar ruta y local antes de visitarlo.</div><div class="tools"><input id="q" placeholder="Buscar negocio, distrito o dirección"><select id="zone"><option value="">Todas las zonas</option><option>Lima</option><option>Callao</option></select><select id="state"><option value="">Todos</option><option value="exact">Dirección enriquecida</option><option value="search">Ubicación por búsqueda</option></select></div><div id="stats" class="stats"></div><section id="grid" class="grid"></section></main><script>
const known={
'hojalateria-y-ferreteria-quintana-eirl':['Jr. Chiquián 2546 Int. 2, Urb. El Agustino','El Agustino'],
'comercial-castro':['Av. Argentina 215','Cercado de Lima'],
'inversiones-y-servicios-p-v-s-a-c':['Jr. Azángaro 983 Int. 8-9','Cercado de Lima'],
'tu-distribuidor-online-s-a-c':['Jr. Washington 934','Cercado de Lima'],
'importaciones-d-j-tools-s-a-c':['Jr. Puno 749 Int. 4, Barrios Altos','Cercado de Lima'],
'pernos-master-sac':['Av. Ramón Cárcamo 428, Tda. E138-139','Cercado de Lima'],
'piemayka-importadora-sac':['Jr. Ramón Cárcamo 661, Torre I 108','Cercado de Lima'],
'uyustools-peru-ltda-srl':['Juan Manuel del Mar y Bernedo 1040','Cercado de Lima'],
'distribucion-e-importaciones-h-c-srl':['Av. Óscar R. Benavides 551','Cercado de Lima'],
'fierro-acero-center':['Av. Argentina 192','Cercado de Lima'],
'ferreteria-jhan-piero-eirl':['Av. Argentina 215','Cercado de Lima'],
'ferreteria-xayna':['Callao','Callao']};
function mapUrl(l,a,d){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([l.company,a,d,'Perú'].filter(Boolean).join(', '))}
async function boot(){const txt=await fetch('index.html').then(r=>r.text());const m=txt.match(/const leads=(\[.*?\]);\s*const \$/s);if(!m){document.querySelector('#grid').textContent='No se pudo leer la base de prospectos.';return}const leads=JSON.parse(m[1]);leads.forEach(l=>{const k=known[l.id];l.address=k?k[0]:'';l.district=k?k[1]:(l.location.includes('Callao')?'Callao':l.location.includes('Cyberplaza')?'Cercado de Lima':l.location);l.geoExact=!!k});const q=document.querySelector('#q'),zone=document.querySelector('#zone'),state=document.querySelector('#state');function draw(){let a=leads.filter(l=>{const hay=[l.company,l.address,l.district,l.location].join(' ').toLowerCase();return(!q.value||hay.includes(q.value.toLowerCase()))&&(!zone.value||[l.district,l.location].join(' ').includes(zone.value))&&(!state.value||(state.value==='exact'?l.geoExact:!l.geoExact))});document.querySelector('#stats').innerHTML=`<span class=pill>${leads.length} prospectos</span><span class=pill>${leads.filter(x=>x.geoExact).length} direcciones enriquecidas</span><span class=pill>${leads.length-leads.filter(x=>x.geoExact).length} ubicables por nombre/distrito</span>`;document.querySelector('#grid').innerHTML=a.map(l=>`<article class=c><div class=name>${l.company}</div><div class=meta>${l.sector} · Distrito/zona: <b>${l.district||'Por verificar'}</b></div><div class=addr>📍 ${l.address||'Dirección exacta pendiente de verificación'}</div><div class=${l.geoExact?'ok':'warn'}>${l.geoExact?'✓ Dirección pública enriquecida':'⚠ El botón Mapa busca el negocio por nombre + zona; confirmar pin antes de visita'}</div><div class=actions><a class="b map" target=_blank href="${mapUrl(l,l.address,l.district)}">🗺️ Abrir en Maps</a>${l.phone?`<a class=b href="tel:${l.phone}">📞 ${l.phone}</a>`:''}<a class=b href="index.html">Ver CRM</a></div></article>`).join('')||'<p>Sin resultados.</p>'}q.oninput=zone.oninput=state.oninput=draw;draw()}boot();</script></body></html>
