<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Leads · Mapa</title><style>body{margin:0;background:#0b1220;color:#eef3f8;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.sub{color:#91a0b3;margin-top:4px}.b{display:inline-block;text-decoration:none;color:#fff;background:#172338;border:1px solid #253247;border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer}.route{background:#3566c8}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:17px 0}.ctl{width:100%;padding:10px;border-radius:9px;border:1px solid #253247;background:#0e1726;color:#fff}.stats,.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border:1px solid #253247;border-radius:999px;color:#bdc8d6;font-size:12px}.routebox{background:#111a2a;border:1px solid #253247;border-radius:13px;padding:14px;margin:14px 0}.routebox h3{margin:0 0 6px}.routebox p{font-size:13px;color:#91a0b3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.c{background:#111a2a;border:1px solid #253247;border-radius:13px;padding:14px}.name{font-weight:800}.meta{color:#91a0b3;font-size:12px;margin-top:3px}.addr{font-size:13px;margin-top:8px;line-height:1.45}.score{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:999px;background:#132238;border:1px solid #31425b;font-size:11px}.check{font-size:12px;color:#aab6c6;margin-top:9px}.sel{font-size:12px;color:#91a0b3;margin-top:9px}@media(max-width:760px){.grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><div class="top"><div><h1>Inventory Leads · Mapa</h1><div class="sub">Todos los prospectos de esta vista tienen dirección y distrito completos en la base.</div></div><div><a class="b" href="index.html">CRM</a> <a class="b" href="whatsapp.html">WhatsApp</a></div></div><div class="tools"><input id="q" class="ctl" placeholder="Buscar negocio, distrito o dirección"><select id="district" class="ctl"><option value="all">Todos los distritos</option></select><select id="sort" class="ctl"><option value="priority">Prioridad</option><option value="district">Distrito</option><option value="name">Nombre</option></select></div><div id="stats" class="stats"></div><div class="routebox"><h3>Ruta comercial</h3><p>Selecciona hasta 9 negocios y abre una ruta en Google Maps. También puedes filtrar por distrito para agrupar una jornada.</p><div class="actions"><button id="bestBtn" class="b route">Seleccionar mejores 5</button><button id="routeBtn" class="b">Abrir ruta</button><button id="clearBtn" class="b">Limpiar</button></div><div id="sel" class="sel">0 seleccionados</div></div><section id="grid" class="grid"></section></main><script>const selected=new Set();function mapQuery(l){return[l.company,l.address,l.district,'Perú'].filter(Boolean).join(', ')}function mapUrl(l){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapQuery(l))}function routeUrl(items){const pts=items.map(mapQuery);if(!pts.length)return'';if(pts.length===1)return'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(pts[0]);return'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(pts[0])+'&destination='+encodeURIComponent(pts.at(-1))+'&waypoints='+encodeURIComponent(pts.slice(1,-1).join('|'))+'&travelmode=driving'}async function boot(){const txt=await fetch('index.html').then(r=>r.text()),m=txt.match(/const leads=(\[.*?\]);\s*const \$/s);if(!m)return;const leads=JSON.parse(m[1]);[...new Set(leads.map(x=>x.district))].sort().forEach(x=>district.insertAdjacentHTML('beforeend',`<option>${x}</option>`));function visible(){const qq=q.value.toLowerCase(),d=district.value;let a=leads.filter(l=>[l.company,l.district,l.address,l.sector].join(' ').toLowerCase().includes(qq)&&(d==='all'||l.district===d));a.sort((a,b)=>sort.value==='name'?a.company.localeCompare(b.company):sort.value==='district'?a.district.localeCompare(b.district):(b.score+b.closeScore)-(a.score+a.closeScore));return a}function draw(){const a=visible();stats.innerHTML=`<span class=pill>${leads.length} prospectos completos</span><span class=pill>${[...new Set(leads.map(x=>x.district))].length} distritos</span><span class=pill>${a.length} visibles</span>`;grid.innerHTML=a.map(l=>`<article class=c><div class=name>${l.company}</div><div class=meta>${l.sector} · ${l.district}</div><div class=addr>📍 ${l.address}<br>📞 ${l.phone}<br>✉️ ${l.email}</div><span class=score>Prioridad ${Math.round((l.score+l.closeScore)/2)}/100</span><label class=check><input type=checkbox data-id="${l.id}" ${selected.has(l.id)?'checked':''}> Añadir a ruta</label><div class=actions style="margin-top:10px"><a class=b target=_blank href="${mapUrl(l)}">Abrir Maps</a><a class=b href="tel:${l.phone}">Llamar</a></div></article>`).join('');grid.querySelectorAll('[data-id]').forEach(c=>c.onchange=()=>{if(c.checked){if(selected.size>=9){c.checked=false;alert('Máximo 9 negocios por ruta.');return}selected.add(c.dataset.id)}else selected.delete(c.dataset.id);sel.textContent=selected.size+' seleccionados'})}q.oninput=district.oninput=sort.oninput=draw;bestBtn.onclick=()=>{selected.clear();visible().slice(0,5).forEach(x=>selected.add(x.id));sel.textContent=selected.size+' seleccionados';draw()};clearBtn.onclick=()=>{selected.clear();sel.textContent='0 seleccionados';draw()};routeBtn.onclick=()=>{const items=leads.filter(x=>selected.has(x.id));const u=routeUrl(items);if(u)window.open(u,'_blank');else alert('Selecciona al menos un negocio.')};draw()}boot();</script></body></html>
